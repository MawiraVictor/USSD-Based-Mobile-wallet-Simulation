<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USSD Wallet Simulator</title>
<style>
  body { font-family: system-ui, sans-serif; background:#222; display:flex;
         justify-content:center; align-items:center; min-height:100vh; margin:0; }
  .phone { background:#000; border:12px solid #333; border-radius:36px;
           width:320px; padding:16px; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .screen { background:#c8e6c9; color:#000; font-family:monospace;
            height:220px; padding:12px; overflow-y:auto; white-space:pre-wrap;
            border-radius:8px; font-size:14px; }
  .input-row { display:flex; gap:8px; margin:10px 0; }
  .input-row input { flex:1; padding:8px; border-radius:6px; border:none; }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .keypad button { padding:14px; font-size:18px; border-radius:8px; border:none;
                   background:#444; color:#fff; cursor:pointer; }
  .keypad button:active { background:#666; }
  .dial { background:#0a0 !important; }
  .end  { background:#a00 !important; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen" id="screen">Dial *141# to start</div>

  <div class="input-row">
    <input id="phone" value="254700000001" placeholder="phone">
  </div>

  <div class="keypad">
    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button onclick="press('*')">*</button>
    <button onclick="press('0')">0</button>
    <button onclick="press('#')">#</button>
    <button class="dial" onclick="dial()">DIAL</button>
    <button class="end" onclick="endSession()">END</button>
  </div>
</div>

<script>
let sessionId = null;
let text = "";

function $(id){ return document.getElementById(id); }

async function send() {
  const body = new URLSearchParams({
    sessionId: sessionId || crypto.randomUUID(),
    phoneNumber: $("phone").value,
    text: text
  });
  const res = await fetch("/ussd", { method: "POST", body });
  const reply = await res.text();
  $("screen").textContent = reply;
  if (reply.startsWith("END")) {
    sessionId = null;
    text = "";
  }
}

function dial() {
  sessionId = crypto.randomUUID();
  text = "";
  send();
}

function press(key) {
  if (!sessionId) { $("screen").textContent = "Dial *141# first"; return; }
  if (key === "#") { send(); return; }   // send current input
  text += key;
  $("screen").textContent += key;
}

function endSession() {
  sessionId = null;
  text = "";
  $("screen").textContent = "Session ended. Dial *141# to start";
}
</script>
</body>
</html>
